<!DOCTYPE html>
<html lang="en" class="dark h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>Admin login — ThreatScope</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/static/tailwind-config.js"></script>
  <link rel="stylesheet" href="/static/theme.css?v=1" />
</head>
<body class="h-full antialiased">
  <header style="border-bottom: 1px solid var(--border); background: rgba(8,12,20,0.9);">
    <div class="max-w-md mx-auto px-5 h-14 flex items-center justify-between">
      <a href="/" class="font-semibold text-white">ThreatScope</a>
      <span class="ts-eyebrow">Admin</span>
    </div>
  </header>
  <main class="max-w-md mx-auto px-5 py-16">
    <h1 class="text-xl font-bold text-white mb-2 text-center">Operator login</h1>
    <p class="ts-caption text-center mb-8" style="color: var(--text-muted)">
      Session access for Intel search and feed accuracy tools.
    </p>
    {% if error %}
    <p class="mb-4 text-center text-sm text-red-400">{{ error }}</p>
    {% endif %}
    <form method="post" action="/admin/login" class="card px-6 py-8">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
      <label class="block ts-caption mb-2" style="color: var(--text-muted)">Password</label>
      <input
        type="password"
        name="password"
        required
        autocomplete="current-password"
        class="input-field w-full rounded-lg px-4 py-3 mb-6"
      />
      <button type="submit" class="btn-scan w-full py-3 rounded-lg">Sign in</button>
    </form>
    <p class="ts-caption text-center mt-6">
      <a href="/" style="color: var(--accent)" class="hover:underline">← Back to ThreatScope</a>
    </p>
  </main>
</body>
</html>
