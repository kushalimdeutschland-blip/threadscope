# ThreatScope — HTTP only for IP access (no TLS until domain + cert).
# Install: /etc/nginx/sites-available/threatscope -> sites-enabled

limit_req_zone $binary_remote_addr zone=threatscope_general:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=threatscope_upload:10m rate=10r/h;

server {
    listen 80;
    server_name 167.233.16.244;

    client_max_body_size 32m;

    location /static/ {
        alias /opt/threatscope/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        limit_req zone=threatscope_general burst=10 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /api/analyze-file {
        limit_req zone=threatscope_upload burst=2 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 32m;
        proxy_read_timeout 300s;
    }
}
