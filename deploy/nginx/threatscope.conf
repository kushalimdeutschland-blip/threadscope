# ThreatScope reverse proxy — place in /etc/nginx/sites-available/ and symlink sites-enabled.
# Replace threatscope.example.com and TLS paths.

limit_req_zone $binary_remote_addr zone=threatscope_general:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=threatscope_upload:10m rate=10r/h;

server {
    listen 443 ssl http2;
    server_name threatscope.example.com;

    ssl_certificate     /etc/letsencrypt/live/threatscope.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/threatscope.example.com/privkey.pem;

    client_max_body_size 32m;

    location /static/ {
        alias /opt/threatscope/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        limit_req zone=threatscope_general burst=10 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /api/analyze-file {
        limit_req zone=threatscope_upload burst=2 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 32m;
        proxy_read_timeout 300s;
    }
}

server {
    listen 80;
    server_name threatscope.example.com;
    return 301 https://$host$request_uri;
}
